name: Render and Release Manuscript

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Manuscript to Word (DOCX)
        run: quarto render microplastic-neurotoxicity_manuscript.qmd --to hikmah-manuscript-docx

      - name: Render Manuscript to Standalone HTML
        run: |
          quarto render microplastic-neurotoxicity_manuscript.qmd --to html --output index.html
          cp index.html microplastic-neurotoxicity_manuscript.html

      - name: Build Replication Package
        run: |
          mkdir -p package/microplastic-neurotoxicity-paper
          cp microplastic-neurotoxicity_manuscript.docx package/microplastic-neurotoxicity-paper/
          cp microplastic-neurotoxicity_manuscript.html package/microplastic-neurotoxicity-paper/
          cp microplastic-neurotoxicity_manuscript.qmd package/microplastic-neurotoxicity-paper/
          cp bibliography.bib package/microplastic-neurotoxicity-paper/
          cp _quarto.yml package/microplastic-neurotoxicity-paper/
          cp README.md package/microplastic-neurotoxicity-paper/
          cp -r csl package/microplastic-neurotoxicity-paper/
          cp -r figures package/microplastic-neurotoxicity-paper/
          cp -r _extensions package/microplastic-neurotoxicity-paper/
          cd package && zip -r ../microplastic-neurotoxicity_replication-package.zip microplastic-neurotoxicity-paper && cd ..
          sha256sum microplastic-neurotoxicity_manuscript.docx microplastic-neurotoxicity_manuscript.html microplastic-neurotoxicity_replication-package.zip > checksums.sha256

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-package
          path: |
            microplastic-neurotoxicity_manuscript.docx
            microplastic-neurotoxicity_manuscript.html
            microplastic-neurotoxicity_replication-package.zip
            checksums.sha256
          if-no-files-found: error

      - name: Prepare Web Distribution
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp -r figures dist/figures
          touch dist/.nojekyll

      - name: Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: github.ref == 'refs/heads/main'
        continue-on-error: true

      - name: Publish Direct-Download Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Latest Manuscript Build"
          draft: false
          prerelease: false
          body: |
            Automated build of the latest manuscript from branch `main`.

            Direct 1-Click Downloads:
            * **Word Document (.docx):** [microplastic-neurotoxicity_manuscript.docx](https://github.com/ht2905/microplastic-neurotoxicity-paper/releases/latest/download/microplastic-neurotoxicity_manuscript.docx)
            * **Standalone HTML (.html):** [microplastic-neurotoxicity_manuscript.html](https://github.com/ht2905/microplastic-neurotoxicity-paper/releases/latest/download/microplastic-neurotoxicity_manuscript.html)
            * **Complete Replication Package (.zip):** [microplastic-neurotoxicity_replication-package.zip](https://github.com/ht2905/microplastic-neurotoxicity-paper/releases/latest/download/microplastic-neurotoxicity_replication-package.zip)
            * **Integrity Checksums (SHA-256):** [checksums.sha256](https://github.com/ht2905/microplastic-neurotoxicity-paper/releases/latest/download/checksums.sha256)
          files: |
            microplastic-neurotoxicity_manuscript.docx
            microplastic-neurotoxicity_manuscript.html
            microplastic-neurotoxicity_replication-package.zip
            checksums.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
